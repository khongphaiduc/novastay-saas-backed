version: '3.8'

networks:
  novastay-network:
    driver: bridge

services:

  # =====================
  # SQL Server
  # =====================
  novastay-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: novastay-sqlserver
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?Set SA_PASSWORD}"
      SQLCMDPASSWORD: "${SA_PASSWORD:?Set SA_PASSWORD}"
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - novastay-sqldata:/var/opt/mssql
    networks:
      - novastay-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s

  # =====================
  # MinIO (Object Storage)
  # =====================
  novastay-minio:
    image: quay.io/minio/minio:latest
    container_name: novastay-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MinIO__AccessKey:?Set MinIO__AccessKey}"
      MINIO_ROOT_PASSWORD: "${MinIO__SecretKey:?Set MinIO__SecretKey}"
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - novastay-minio-data:/data
    networks:
      - novastay-network

  # =====================
  # Backend API (.NET 8)
  # =====================
  novastay-api:
    image: novastay-api:latest
    env_file:
      - .env
    container_name: novastay-api
    restart: always
    ports:
      - "7286:8080"
    environment:
      SQLString: "${SQLString:?Set SQLString for novastay-sqlserver}"
      RabbitMQ_HostName: "${RabbitMQ_HostName:?Set RabbitMQ_HostName}"
      RabbitMQ_UserName: "${RabbitMQ_UserName:?Set RabbitMQ_UserName}"
      RabbitMQ_Password: "${RabbitMQ_Password:?Set RabbitMQ_Password}"
      MinIO__Endpoint: "novastay-minio:9000"
      MinIO__AccessKey: "${MinIO__AccessKey:?Set MinIO__AccessKey}"
      MinIO__SecretKey: "${MinIO__SecretKey:?Set MinIO__SecretKey}"
      MinIO__BucketName: "novastay"
      MinIO__UseSSL: "false"
      MinIO__PublicEndpoint: "http://161.248.147.31:9000"
    depends_on:
      novastay-sqlserver:
        condition: service_healthy
      novastay-minio:
        condition: service_started
    networks:
      - novastay-network

  # =====================
  # Frontend (React + Nginx)
  # =====================
  novastay-frontend:
    image: novastay-frontend:latest
    container_name: novastay-frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - novastay-network
    depends_on:
      - novastay-api

volumes:
  novastay-sqldata:
  novastay-minio-data:
